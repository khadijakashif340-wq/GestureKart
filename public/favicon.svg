<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0a0d14"/>
  <rect width="62" height="62" x="1" y="1" rx="13" fill="none" stroke="#1e293b" stroke-width="1.5"/>
  <!-- Steering Arc & Hands -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="url(#neonGrad)" stroke-width="3.5" stroke-dasharray="100 25" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="5" fill="#10b981" filter="url(#glow)"/>
  <!-- Stylized Kart / Road Perspective -->
  <path d="M 22 46 L 30 24 L 34 24 L 42 46 Z" fill="none" stroke="#06b6d4" stroke-width="2"/>
  <line x1="32" y1="46" x2="32" y2="38" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
</svg>
